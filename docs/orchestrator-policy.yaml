version: 2
product: Unified Support Inbox
status: frozen-v1
operational_decision:
  jira: USI-247
  date: '2026-10-29'
  owner_preference: ci_gated_automatic_integration_without_manual_reviewer
  changes_product_contract: false

source_precedence:
  - current_jira_ticket_later_final_decision_contract_override_or_resolved_comment
  - e00_and_e01_e25_parent_preflight_freeze
  - product_contract_and_decision_registry
  - canonical_product_workflow_architecture_integrations_security_operations_docs
  - older_non_conflicting_docs_and_implementation

dependency_graph:
  sources:
    - native_jira_link
    - ticket_dependencies_description
    - reviewed_manual_override
  provenance_required: true
  ready_requires_all_dependencies_status: Gotowe
  scan_whole_graph: true
  detect_cycles: true

jira_lifecycle:
  todo: Do zrobienia
  working: W toku
  review: Do przeglądu
  done: Gotowe
  done_only_after_actual_merge_and_required_dod: true
  decision_freeze_alone_marks_done: false

workers:
  developer:
    may_merge: false
    may_mark_jira_done: false
    production_credentials: false
    preferred_jira_mutation_credentials: false
    duties: [implement, test, commit, push, create_or_update_pr, completion_report]
  decision:
    escalate_only_real_contract_change: true
  reviewer:
    manual_review_required_by_default: false
    never_fabricate_approval: true
    if_required_review_exact_head_sha: true
    allowed_results: [APPROVE, REQUEST_CHANGES, BLOCKED]
  integrator:
    separate_from_developer_worker: true
    inspect_existing_and_new_review_queue: true
    may_merge_only_after_all_effective_gates_pass: true
    verify_actual_main_merge_before_jira_done: true

automation:
  target_mode: ci_gated_auto_merge
  runner_workflow: .github/workflows/usi-integration.yml
  guard_script: scripts/ci_merge.mjs
  eligibility_attestation_label: usi/merge-ready
  eligibility_attestation_source: trusted_immutable_pr_issue_comment
  attestor_identity_from_authorized_repository_variable: USI_ATTESTOR_USER_ID
  attestation_binding: [pr_number, head_sha, base_sha, jira_key]
  attestation_required_evidence: [jira_dependencies, jira_dod, external_verification, security, worker_lease]
  attestation_max_lifetime_minutes: 10
  attestation_evidence_max_age_minutes: 5
  attestation_revocation_and_recheck_required: true
  external_jira_dod_and_lease_verification_required: true
  repository_actions_activation_variable: USI_AUTO_MERGE_ENABLED
  unattended_merge_enabled: false
  merge_to_main_serialized: true
  activation_requires:
    - authorized_operational_policy_change_landed
    - effective_github_rulesets_verified
    - automation_identity_and_permissions_verified
    - end_to_end_nonproduction_merge_path_validated
  unavailable_verification: record_and_continue_independent_ticket
  validation_outcomes: [PASS, FAIL, NOT_RUN, BLOCKED]

merge_gate:
  method: squash
  standard_pr_human_review_default_required: false
  required_workflow: CI
  required_workflow_jobs: [configuration, backend, integration, infrastructure, openapi, validate]
  requires:
    - validated_head_sha_equals_current_pr_head
    - full_required_ci_and_security_green
    - no_pending_or_unjustified_skipped_required_checks
    - meaningful_automated_coverage
    - pr_mergeable
    - effective_github_protection_satisfied
    - no_unresolved_review_or_security_blocker
    - all_dependencies_still_done
    - no_new_higher_precedence_contract_change
    - required_ticket_verification_and_dod_complete
    - no_production_secret_or_prohibited_action
    - actual_approval_if_still_required_by_effective_rule
  never_treat_not_run_or_blocked_as_pass: true
  never_weaken_failing_tests_for_green_ci: true

conflicts:
  default_strategy: merge_latest_main_into_feature
  default_rebase: false
  default_force_push: false
  rerun_validation: true
  full_rereview_if_review_required_after_head_change: true

restart_safety:
  durable_state: true
  recommended_store: sqlite
  leases_and_heartbeat: true
  reconcile_remote_state_before_new_mutations: true
  mutation_idempotency_required: true
  track:
    - ticket_state
    - lease
    - branch_and_worktree
    - pr_number
    - pr_head_sha
    - validated_head_sha_and_ci_security_results
    - reviewed_sha_and_result_if_required
    - validation_state_pass_fail_not_run_blocked
    - deferred_verification_and_revisit_condition
    - remote_mutation_markers
    - merged_main_sha

production_boundary:
  codex_has_production_credentials: false
  explicit_human_approval_required_for:
    - production_deployment
    - pitr_or_destructive_recovery
    - production_secret_rotation
    - dns_or_provider_callback_cutover
    - return_to_service_after_high_risk_recovery

provider_freshness:
  official_vendor_docs_may_update_technical_details: true
  product_scope_may_change_without_human: false
  security_boundary_may_change_without_human: false
