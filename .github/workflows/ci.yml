name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test environment and secret-handling contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate checked-in development examples
        run: |
          python3 scripts/validate_environment.py api --env-file .env.example
          python3 scripts/validate_environment.py web --env-file apps/web/.env.example

      - name: Scan worktree and Git history for secrets
        run: python3 scripts/secret_scan.py

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose contract
        run: |
          docker compose --env-file infra/.env.example -f infra/compose.yaml config --format json \
            | python3 infra/tests/assert-compose-config.py

      - name: Verify clean start, health, persistence, and reset
        run: infra/tests/verify-compose-lifecycle.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify backend unit, module, and architecture tests
        working-directory: apps/api
        run: ./mvnw --batch-mode clean verify -DexcludedGroups=integration

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify Testcontainers integration tests
        working-directory: apps/api
        run: ./mvnw --batch-mode test -Dgroups=integration

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_WS_BASE_URL: /ws

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enable pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @usi/web exec playwright install --with-deps chromium

      - name: Run mandatory pnpm check
        run: pnpm check

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

# The canonical OpenAPI generation/compatibility job becomes required when the
# API contract ticket introduces the versioned specification and generated client.
