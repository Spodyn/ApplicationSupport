name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Test environment and secret-handling contract
        run: python3 scripts/testing/run_config_tests.py

      - name: Test fail-closed auto-merge guard
        run: node --test scripts/tests/ci_gate.test.mjs scripts/tests/ci_workflow.test.mjs scripts/tests/ci_merge.test.mjs scripts/tests/delete_merged_branch.test.mjs scripts/tests/prune_merged_branches.test.mjs

      - name: Verify feature traceability and changed-line formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          node scripts/testing/check-inventory.mjs
          BASE_SHA="$(node scripts/testing/base-ref.mjs)"
          git diff --check "$BASE_SHA" HEAD

      - name: Validate checked-in development examples
        run: |
          python3 scripts/validate_environment.py api --env-file .env.example
          python3 scripts/validate_environment.py web --env-file apps/web/.env.example

      - name: Scan worktree and Git history for secrets
        run: python3 scripts/secret_scan.py

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Docker Compose contract
        run: |
          docker compose --env-file infra/.env.example -f infra/compose.yaml config --format json \
            | python3 infra/tests/assert-compose-config.py

      - name: Verify clean start, health, persistence, and reset
        run: infra/tests/verify-compose-lifecycle.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify backend unit, module, and architecture tests
        working-directory: apps/api
        run: ./mvnw --batch-mode clean verify -Pcoverage -DexcludedGroups=integration

      - name: Resolve and scan Maven dependencies (fail closed)
        run: |
          (cd apps/api && ./mvnw --batch-mode dependency:list -DoutputFile=target/security-dependencies.txt)
          python3 scripts/security_dependencies.py --maven-list apps/api/target/security-dependencies.txt

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-reports
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/site/jacoco/
            apps/api/target/api-surface-evidence.json
          if-no-files-found: warn
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Build pinned MinIO test image from official source
        run: bash infra/minio/build-source-images.sh server

      - name: Verify Testcontainers integration tests
        working-directory: apps/api
        run: ./mvnw --batch-mode test -Dgroups=integration

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-test-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enable pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI source, deterministic generation, TypeScript and adapter smoke
        run: pnpm openapi:check

      - name: Reject breaking v1 contract changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "Could not resolve an exact compatibility base SHA." >&2
            exit 1
          fi
          pnpm openapi:compat -- --base-ref "$BASE_SHA"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_WS_BASE_URL: /ws

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enable pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @usi/web exec playwright install --with-deps chromium

      - name: Run mandatory pnpm check
        run: pnpm check

      - name: Scoped security and transport coverage baseline
        run: pnpm test:coverage

      - name: Require coverage of changed executable lines in scoped modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          BASE_SHA="$(node scripts/testing/base-ref.mjs)"
          python3 scripts/testing/changed_coverage.py --base-ref "$BASE_SHA"

      - name: Block actionable high and critical npm advisories
        run: pnpm audit --audit-level=high

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_WS_BASE_URL: /ws
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Enable pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Install committed dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @usi/web exec playwright install --with-deps chromium
      - name: Build pinned disposable MinIO
        run: bash infra/minio/build-source-images.sh server
      - name: Build production frontend
        run: pnpm build
      - name: Run real browser, backend, database, broker and object store workflows
        run: pnpm test:fullstack
      - name: Upload synthetic full-stack failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fullstack-failure-evidence
          path: |
            apps/web/test-results/fullstack/
            apps/api/target/fullstack-runtime.log
          retention-days: 7

  validate:
    if: always()
    needs: [configuration, backend, integration, infrastructure, openapi, web, fullstack]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout gate implementation from the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject failed, cancelled, skipped or missing regression jobs
        env:
          USI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/testing/ci-gate.mjs
