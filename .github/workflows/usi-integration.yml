name: USI CI-gated integration

# Trusted default-branch workflow only. Never checkout or run untrusted PR code.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate"
        required: true
        type: number

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: usi-main-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'usi/merge-ready') ||
      (github.event_name == 'pull_request_target' &&
        github.event.action == 'ready_for_review') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify merge guard regression tests
        run: node --test scripts/tests/ci_merge.test.mjs
      - name: Qualify and integrate PR (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          USI_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || inputs.pr_number }}
          USI_AUTO_MERGE_ENABLED: ${{ vars.USI_AUTO_MERGE_ENABLED }}
        run: node scripts/ci_merge.mjs
