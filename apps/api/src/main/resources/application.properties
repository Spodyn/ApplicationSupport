# Shared non-secret configuration. Values without defaults are deliberately
# required so Spring startup fails when deployment configuration is incomplete.
spring.application.name=usi-api

# Schema ownership belongs exclusively to Flyway. Hibernate validates the
# migrated schema and must never infer or create production objects.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Browser sessions are server-side and durable. Flyway owns the Spring Session
# JDBC tables, so Spring Boot must never initialize or mutate their schema.
spring.session.timeout=12h
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
server.servlet.session.cookie.name=USI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Durable outbox delivery owns retries. RabbitTemplate itself does not perform
# hidden in-memory retries; each publish is checkpointed through PostgreSQL.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=false

usi.outbox.exchange=usi.events
usi.outbox.batch-size=50
usi.outbox.claim-lease=30s
usi.outbox.retry-delay=5s
usi.outbox.confirm-timeout=5s
usi.outbox.poll-interval=1s
usi.outbox.relay-enabled=true

# Notification delivery state is durable in PostgreSQL. RabbitMQ carries only
# wake-up signals. The listener remains off until the common provider gateway
# is supplied by E15-T05; delivery lifecycle tests invoke the worker explicitly.
usi.notifications.worker.enabled=false
usi.notifications.worker.batch-size=50
usi.notifications.worker.claim-lease=30s
usi.notifications.worker.base-retry-delay=5s
usi.notifications.worker.max-retry-delay=5m
usi.notifications.worker.max-attempts=5
usi.notifications.worker.poll-interval=1s

# Slack Events API ingress persists and reserves a transactional outbox wake-up
# before HTTP acknowledgement. The listener remains off until E12-T04 supplies
# the real Slack filtering/normalization handler; USI-129 tests use a fake handler.
usi.slack.inbound-worker.enabled=false
usi.slack.inbound-worker.batch-size=50
usi.slack.inbound-worker.base-retry-delay=5s
usi.slack.inbound-worker.max-retry-delay=5m
usi.slack.inbound-worker.max-attempts=5
usi.slack.inbound-worker.poll-interval=1s

# Only health is exposed. Detailed component information is denied by default;
# local development explicitly opts in below.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

usi.deployment.profile=${SPRING_PROFILES_ACTIVE}
usi.public-base-url=${USI_PUBLIC_BASE_URL}
usi.provider-callbacks.slack=${USI_SLACK_CALLBACK_URL}
usi.provider-callbacks.teams=${USI_TEAMS_CALLBACK_URL}
usi.provider-callbacks.telegram=${USI_TELEGRAM_CALLBACK_URL}
usi.security.cors.allowed-origins=${USI_CORS_ALLOWED_ORIGINS:}

# Provider identifiers are non-secret and optional until an integration is
# configured. Credentials are resolved through an Integration.secret_ref.
usi.providers.slack.client-id=${USI_SLACK_CLIENT_ID:}
usi.providers.teams.client-id=${USI_TEAMS_CLIENT_ID:}
usi.providers.teams.tenant-id=${USI_TEAMS_TENANT_ID:}
usi.providers.telegram.bot-username=${USI_TELEGRAM_BOT_USERNAME:}
