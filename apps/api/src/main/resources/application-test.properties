spring.config.activate.on-profile=test

# Tests provide data-service connection properties dynamically (for example,
# from Testcontainers) and use fake provider adapters with in-memory secrets.
usi.integration-secrets.backend=in-memory
usi.deployment.profile=test
usi.public-base-url=http://localhost:3000
usi.provider-callbacks.slack=https://test.example.invalid/api/v1/provider-callbacks/slack
usi.provider-callbacks.teams=https://test.example.invalid/api/v1/provider-callbacks/teams
usi.provider-callbacks.telegram=https://test.example.invalid/api/v1/provider-callbacks/telegram

# USI-48 has no domain schema yet. An in-memory datasource keeps the bootstrap
# context test hermetic; production remains PostgreSQL-only.
spring.datasource.url=jdbc:h2:mem:usi_api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
