spring.config.activate.on-profile=test

# Tests provide data-service connection properties dynamically (for example,
# from Testcontainers) and use fake provider adapters with in-memory secrets.
usi.integration-secrets.backend=in-memory
usi.deployment.profile=test
usi.public-base-url=http://localhost:3000
usi.provider-callbacks.slack=https://test.example.invalid/api/v1/provider-callbacks/slack
usi.provider-callbacks.teams=https://test.example.invalid/api/v1/provider-callbacks/teams
usi.provider-callbacks.telegram=https://test.example.invalid/api/v1/provider-callbacks/telegram
usi.object-storage.endpoint=http://localhost:9000
usi.object-storage.region=us-east-1
usi.object-storage.attachments-bucket=usi-attachments-test
usi.object-storage.exports-bucket=usi-exports-test

# Deterministic small pool; Testcontainers tests override only connection values.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000

# USI-48 has no domain schema yet. An in-memory datasource keeps bootstrap unit
# tests hermetic; integration tests override it with PostgreSQL Testcontainers.
spring.datasource.url=jdbc:h2:mem:usi_api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
