spring.config.activate.on-profile=local

spring.datasource.url=${USI_DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.rabbitmq.host=${USI_RABBITMQ_HOST}
spring.rabbitmq.port=${USI_RABBITMQ_PORT}
spring.rabbitmq.virtual-host=${USI_RABBITMQ_VHOST}
usi.object-storage.endpoint=${USI_OBJECT_STORAGE_ENDPOINT}
usi.object-storage.region=${USI_OBJECT_STORAGE_REGION}
usi.object-storage.attachments-bucket=${USI_ATTACHMENTS_BUCKET}
usi.object-storage.exports-bucket=${USI_EXPORTS_BUCKET}

# Local developers may inspect component health; all non-local profiles inherit
# the deny-by-default health detail policy from application.properties.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Plain environment credentials are accepted only for disposable local data
# services. The committed .env.example contains intentionally obvious dev data.
spring.datasource.username=${USI_DATABASE_USERNAME}
spring.datasource.password=${USI_DATABASE_PASSWORD}
spring.rabbitmq.username=${USI_RABBITMQ_USERNAME}
spring.rabbitmq.password=${USI_RABBITMQ_PASSWORD}
usi.object-storage.access-key=${USI_OBJECT_STORAGE_ACCESS_KEY}
usi.object-storage.secret-key=${USI_OBJECT_STORAGE_SECRET_KEY}

usi.integration-secrets.backend=filesystem
usi.integration-secrets.directory=${USI_INTEGRATION_SECRETS_DIRECTORY}
