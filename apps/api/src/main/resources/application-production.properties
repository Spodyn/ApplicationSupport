spring.config.activate.on-profile=production

# Deprecated compatibility alias for deployments created before USI-50.
# New deployments must use the canonical `prod` profile. The security and
# datasource contract intentionally matches application-prod.properties.
spring.config.import=configtree:${USI_CORE_SECRETS_DIRECTORY}

spring.datasource.url=${USI_DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.rabbitmq.host=${USI_RABBITMQ_HOST}
spring.rabbitmq.port=${USI_RABBITMQ_PORT}
spring.rabbitmq.virtual-host=${USI_RABBITMQ_VHOST}
usi.object-storage.endpoint=${USI_OBJECT_STORAGE_ENDPOINT}
usi.object-storage.region=${USI_OBJECT_STORAGE_REGION}
usi.object-storage.attachments-bucket=${USI_ATTACHMENTS_BUCKET}
usi.object-storage.exports-bucket=${USI_EXPORTS_BUCKET}

# Keep the compatibility profile aligned with the canonical production cookie contract.
server.servlet.session.cookie.secure=true

usi.integration-secrets.backend=configtree
usi.integration-secrets.directory=${USI_INTEGRATION_SECRETS_DIRECTORY}
